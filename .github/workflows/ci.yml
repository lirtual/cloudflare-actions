name: Provider checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unified-actions-provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Temporary lockfile generation for test-only runtime upgrade
        run: |
          pnpm install --no-frozen-lockfile
          echo 'SPEC874_LOCKFILE_BEGIN'
          base64 -w 1024 pnpm-lock.yaml
          echo 'SPEC874_LOCKFILE_END'
      - run: pnpm run check
